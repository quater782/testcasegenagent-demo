/div><div class="pop-section"><div class="pop-label">推荐结果</div>${cases.map(c=>`<div class="thought-step"><b>${esc(humanText(c.title||""))}</b></div>`).join("")||`<div class="muted">暂无结果</div>`}</div></div></section>`;requestAnimationFrame(()=>{positionPopover();patchTaskTrace(task.taskId)})}
function positionPopover(){if(!state.popover)return;const anchor=document.getElementById(state.popover.anchorId),pop=$("#workerPopover");if(!anchor||!pop)return;const r=anchor.getBoundingClientRect(),gap=8,w=pop.offsetWidth,h=pop.offsetHeight;let left=Math.min(window.innerWidth-w-12,Math.max(12,r.left)),top=r.bottom+gap;if(top+h>window.innerHeight-12)top=Math.max(12,r.top-h-gap);pop.style.left=`${left}px`;pop.style.top=`${top}px`}
function pendingOperationLabel(snap){const name=humanText(snap.displayName)||preview(humanText(snap.rawInput||""),80);return`#${esc(snap.order)}「${esc(name||snap.workItemId||"未命名")}」`}
function maybeShowPendingOperationModal(){const pending=context().pendingOperation;if(!pending||pending.status!=="awaiting_confirmation"){if(state.shownOperationId&&(!pending||pending.operationId!==state.shownOperationId))state.shownOperationId=null;return}if(activeExecution()||activeTurn()||state.localBusy)return;const opId=String(pending.operationId||"");if(!opId||state.shownOperationId===opId)return;const snaps=pending.targetSnapshots||[],verb=pending.type==="delete"?"删除":"修改";const list=snaps.length?`<ul style="margin:8px 0 0;padding-left:18px">${snaps.map(s=>`<li style="margin:4px 0">${pendingOperationLabel(s)}</li>`).join("")}</ul>`:`<p class="muted">未找到目标明细</p>`;let extra="";if(pending.type==="modify"){const summary=humanText(pending.editSummary||"");const before=snaps[0]?preview(humanText(snaps[0].rawInput||""),120):"";const after=preview(humanText(pending.newRawInput||""),120);extra=`${summary?`<p class="muted" style="margin-top:10px">修改说明：${esc(summary)}</p>`:""}${before||after?`<p class="muted" style="margin-top:6px">修改前：${esc(before||"—")}<br>修改后：${esc(after||"—")}</p>`:""}`}state.shownOperationId=opId;openModal(`${verb}确认`,`<p>确认${verb}以下 ${snaps.length||pending.targetWorkItemIds&&pending.targetWorkItemIds.length||0} 项？</p>${list}${extra}`,`<button class="ghost" onclick="decidePendingOperation('cancel')">取消</button><button class="${pending.type==="delete"?"danger":"primary"}" onclick="decidePendingOperation('confirm')">${verb==="删除"?"确认删除":"确认修改"}</button>`)}
async function decidePendingOperation(decision){const pending=context().pendingOperation;if(!pending||pending.status!=="awaiting_confirmation"){closeModal();return}if(activeExecution()||activeTurn()||state.localBusy){toast("运行中不能确认，请先等待完成");return}const conversationId=state.conversationId,opId=String(pending.operationId||""),snaps=pending.targetSnapshots||[];closeModal();state.localBusy=true;renderComposer();try{const d=await api("POST",`/api/conversations/${encodeURIComponent(conversationId)}/control`,{projectId:state.projectId,action:decision==="confirm"?"confirm_operation":"cancel_operation",operationId:opId});await refreshStatus(false,conversationId);state.localBusy=false;state.shownOperationId=null;renderAll();scheduleConversationListRefresh();if(decision==="confirm"&&pending.type==="delete"){const n=(d.deletedWorkItemIds||[]).length||snaps.length;toast(n?`已删除 ${n} 个工作项`:"已删除")}else if(decision==="cancel")toast("已取消")}catch(e){state.localBusy=false;state.shownOperationId=null;renderAll();toast(e.message)}}
function openDeleteWorkItem(workItemId){if(activeExecution()||activeTurn()||state.localBusy){toast("运行中不能删除，请先停止或等待完成");return}const view=currentResultView(),row=(view&&view.recommendationsByWorkItem||[]).find(item=>item.workItemId===workItemId);if(!row){toast("工作项不存在或已更新");return}const name=humanText(row.displayName)||preview(humanText(row.rawInput||""),80);openModal("删除工作项",`<p>确认删除工作项 #${esc(row.order)}「${esc(name)}」？</p>`,`<button class="ghost" onclick="closeModal()">取消</button><button class="danger" onclick="confirmDeleteWorkItem('${esc(workItemId)}')">删除</button>`)}
async function confirmDeleteWorkItem(workItemId){if(activeExecution()||activeTurn()||state.localBusy)return;const conversationId=state.conversationId;const view=currentResultView(),row=(view&&view.recommendationsByWorkItem||[]).find(item=>item.workItemId===workItemId);const name=row?(humanText(row.displayName)||preview(humanText(row.rawInput||""),80)):"";const order=row?row.order:"";closeModal();state.localBusy=true;renderAll();try{await api("POST",`/api/conversations/${encodeURIComponent(conversationId)}/control`,{projectId:state.projectId,action:"delete_work_item",workItemId,source:"right_panel"});await refreshStatus(false,conversationId);state.localBusy=false;renderAll();scheduleConversationListRefresh();toast(order?`已删除 #${order}「${name}」`:"已删除该工作项")}catch(e){state.localBusy=false;renderAll();toast(e.message)}}
function openModal(title,body,actions){$("#modalRoot").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><span class="modal-title">${esc(title)}</span><button class="icon-btn" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-actions">${actions||""}</div></div></div>`}function closeModal(){$("#modalRoot").innerHTML=""}
function exportWorkbook(){if(state.conversationId)location.href=`/api/recommend/export?runId=${encodeURIComponent(state.conversationId)}&projectId=${encodeURIComponent(state.projectId)}`}function toggleLeft(){state.leftCollapsed=!state.leftCollapsed;$("#layout").classList.toggle("left-collapsed",state.leftCollapsed)}function toggleRight(){if(state.resultsMaximized)toggleResultsMaximized(false);const opening=state.rightCollapsed;state.autoRightCollapsed=false;state.manualRightOpenOnNarrow=opening&&window.innerWidth<1180;state.rightCollapsed=!state.rightCollapsed;$("#layout").classList.toggle("right-collapsed",state.rightCollapsed)}
function toggleResultsMaximized(force){const layout=$("#layout"),on=force===undefined?!state.resultsMaximized:!!force;if(on&&!state.resultsMaximized)state.maxPreviousRightCollapsed=!!state.rightCollapsed;state.resultsMaximized=on;layout.classList.toggle("results-maximized",on);if(on){state.rightCollapsed=false;layout.classList.remove("right-collapsed")}else{state.rightCollapsed=!!state.maxPreviousRightCollapsed;layout.classList.toggle("right-collapsed",state.rightCollapsed);state.maxPreviousRightCollapsed=false;applyResponsiveLayout()}const btn=$("#immersiveToggle");if(btn){btn.textContent=on?"⤢":"⛶";btn.title=on?"退出最大化":"最大化结果工作台"}renderResults({preserveScroll:true})}function toggleImmersiveMode(){toggleResultsMaximized()}
function applyResponsiveLayout(){const layout=$("#layout");if(!layout||state.resultsMaximized)return;state.manualRightOpenOnNarrow=false;if(state.autoRightCollapsed){state.rightCollapsed=false;state.autoRightCollapsed=false;layout.classList.remove("right-collapsed")}}
function toggleAllSteps(force){state.stepsOpenAll=force===undefined?!state.stepsOpenAll:!!force;if(state.stepsOpenAll)state.caseStepsOpen={};renderResults({preserveScroll:true})}function toggleAllGroups(open){toggleAllSteps(open)}
function setupResize(){const h=$("#rightResize"),layout=$("#layout");h.addEventListener("pointerdown",e=>{if(window.innerWidth<850)return;e.preventDefault();let frame=0,lastX=e.clientX;h.classList.add("dragging");layout.classList.add("resizing");document.body.classList.add("resizing-ui");const apply=()=>{frame=0;const max=Math.min(720,window.innerWidth-500),width=Math.max(320,Math.min(max,window.innerWidth-lastX));document.documentElement.style.setProperty("--right",`${width}px`);localStorage.setItem("recommendRightWidth",String(Math.round(width)));positionPopover()};const move=ev=>{lastX=ev.clientX;if(!frame)frame=requestAnimationFrame(apply)};const up=()=>{if(frame)cancelAnimationFrame(frame);apply();h.classList.remove("dragging");layout.classList.remove("resizing");document.body.classList.remove("resizing-ui");window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up)};window.addEventListener("pointermove",move);window.addEventListener("pointerup",up,{once:true});window.addEventListener("pointercancel",up,{once:true})})}
$("#composer").addEventListener("input",()=>{if(state.conversationId)state.drafts[state.conversationId]=$("#composer").value;autoGrowComposer()});document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closePopover()}if(e.key==="Enter"&&e.ctrlKey)sendMessage()});window.addEventListener("resize",()=>{positionPopover();applyResponsiveLayout()});$("#timeline").addEventListener("scroll",positionPopover,{passive:true});window.addEventListener("beforeunload",()=>{saveDraft();closeStream()});setInterval(()=>{if(state.conversationId&&(activeExecution()||activeTurn()||state.localBusy)){renderComposer();renderHeader()}},5000);init();
